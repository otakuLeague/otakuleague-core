services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is not set. Run cp .env.example .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set. Run cp .env.example .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is not set. Run cp .env.example .env}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:?POSTGRES_TEST_DB is not set. Run cp .env.example .env}
    ports:
      # Loopback only: the database is never reachable from the local network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is empty (first start or after db:reset).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: during init Postgres listens on the socket only.
      # Querying the test database keeps a half-initialised volume unhealthy.
      test: psql -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_TEST_DB" -tAc 'select 1'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
