name: Setup
description: Node from .nvmrc, pnpm from packageManager, cached pnpm store, frozen install.
runs:
  using: composite
  steps:
    # Reads the pnpm version from package.json `packageManager`.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    # Caches the pnpm store only, never node_modules (no stale .vitest-cache, OTA-82).
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
