name: DB backup

# Nightly encrypted dump of the production database (OTA-170, docs/deploy.md "Backups").
# The repo is public: anyone can read the run logs and download the artifact. So the dump is
# encrypted with age to Farouk's public key before it is written to any file, and no step prints
# the connection string or any part of it. pg_dump runs from the postgres:18 image because the
# client must be at least the server's major version (production runs 18; apt's client is older).
on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC, off the hour: GitHub delays top-of-the-hour runs the most.
  workflow_dispatch:

# No checkout and no API call; upload-artifact uses the runner's own token, not GITHUB_TOKEN.
permissions: {}

# Never two dumps at once: a second run waits for the first instead of cancelling it.
concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup
    # A fork has neither the secrets nor any business dumping production.
    if: github.repository == 'otakuLeague/otakuleague-core'
    # Pinned, not -latest: the image decides the apt age version, which decides the key formats.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Secrets live in this environment, which only main may use (OTA-170 hardening).
    environment: db-backup
    steps:
      - name: Install age
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age

      # Each secret reaches only the steps that read it, never the job env or a third-party action.
      - name: Check secrets
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ -n "${BACKUP_DATABASE_URL:-}" ]] || fail 'Secret BACKUP_DATABASE_URL is missing or empty.'
          [[ -n "${BACKUP_AGE_PUBLIC_KEY:-}" ]] || fail 'Secret BACKUP_AGE_PUBLIC_KEY is missing or empty.'
          # Only a native age recipient (age1 + 58 bech32 characters). Also stops a private key
          # (AGE-SECRET-KEY-1...) pasted into the wrong secret before age can echo it in an error.
          [[ "$BACKUP_AGE_PUBLIC_KEY" =~ ^age1[qpzry9x8gf2tvdw0s3jn54khce6mua7l]{58}$ ]] ||
            fail 'BACKUP_AGE_PUBLIC_KEY is not an age public key (age1 followed by 58 characters).'

      - name: Pull the Postgres 18 client
        run: docker pull --quiet postgres:18

      - name: Dump and encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_AGE_PUBLIC_KEY: ${{ secrets.BACKUP_AGE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # The URL is split into libpq's PG* variables, so no part of it is on any command line
          # (pg_dump's argv included). A query string could override sslmode, and decoding %XX is
          # not worth the risk: both are refused, as is any character outside these classes.
          [[ "$BACKUP_DATABASE_URL" != *'?'* ]] ||
            fail 'BACKUP_DATABASE_URL has a query string (?...). Remove it: this job sets sslmode itself.'
          [[ "$BACKUP_DATABASE_URL" != *%* ]] ||
            fail 'BACKUP_DATABASE_URL has a percent-encoded character. Use a password of letters and digits.'
          url='^postgres(ql)?://([A-Za-z0-9._-]+):([A-Za-z0-9._~-]+)@([A-Za-z0-9.-]+):([0-9]{1,5})/([A-Za-z0-9._-]+)$'
          [[ "$BACKUP_DATABASE_URL" =~ $url ]] ||
            fail 'BACKUP_DATABASE_URL is not a postgresql://user:password@host:port/database URL.'
          export PGUSER="${BASH_REMATCH[2]}" PGPASSWORD="${BASH_REMATCH[3]}" PGHOST="${BASH_REMATCH[4]}"
          export PGPORT="${BASH_REMATCH[5]}" PGDATABASE="${BASH_REMATCH[6]}" PGSSLMODE=require
          # GitHub masks the whole secret, not its parts, and a pg_dump error prints the host and
          # port. In a public repo the proxy port is what singles out our database. The user stays
          # visible: masking "postgres" would blank every mention of the image.
          echo "::add-mask::$PGPASSWORD"
          echo "::add-mask::$PGHOST"
          echo "::add-mask::$PGPORT"
          dir="$RUNNER_TEMP/db-backup"
          file="$dir/otakuleague-$(date -u +%Y-%m-%dT%H%MZ).dump.age"
          mkdir -p "$dir"
          # `-e NAME` copies the value from this step's env, by name only. --log-driver none: the
          # container's stdout (the plaintext dump) is streamed to us but never written to Docker's
          # log file. PGSSLMODE=require refuses an unencrypted connection. The data of the AniList
          # and Jikan cache tables is left out (ADR 0006: never a backup of their data; it
          # re-imports on demand); their schema is kept. The same goes for the short-lived auth
          # tables (ADR 0015: rate-limit counters, emailed-link tokens, username holds): the daily
          # cleanup deletes their rows within about a day, and a 60-day backup must not keep them.
          # pipefail fails the step if pg_dump (via docker's exit code) or age fails.
          docker run --rm --pull=never --log-driver none \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:18 \
            pg_dump --format=custom --no-owner --no-privileges --no-password \
            --exclude-table-data=public.anime_source_snapshot \
            --exclude-table-data=public.anime_relation_node \
            --exclude-table-data=public.anime_list_page \
            --exclude-table-data=public.auth_rate_limit \
            --exclude-table-data=public.auth_token \
            --exclude-table-data=public.auth_username_hold |
            age --encrypt --recipient "$BACKUP_AGE_PUBLIC_KEY" --output "$file"
          # Both can exit 0 on an empty stream: the file must outweigh age's encryption of nothing.
          size=$(($(wc -c < "$file")))
          empty=$(($(age --encrypt --recipient "$BACKUP_AGE_PUBLIC_KEY" < /dev/null | wc -c)))
          ((size > empty)) || fail 'The dump is empty; nothing was uploaded.'
          echo "Encrypted dump: $size bytes"
          echo "Encrypted dump: $size bytes, kept 60 days as artifact \`db-backup\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: db-backup
          path: ${{ runner.temp }}/db-backup/
          retention-days: 60
          if-no-files-found: error
          # Already compressed (pg_dump -Fc) and encrypted: zipping again would only cost time.
          compression-level: 0
