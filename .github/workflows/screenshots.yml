name: Screenshots

# Screenshots of the real pages on every web PR (OTA-163, ADR 0013).
# `capture` runs PR code with a read-only token and no secret. `publish` has a write token and
# runs no code from the repo: it only moves the images and the comment text. Everything after the
# health checks is best effort; only a crashed app fails the run.
on:
  pull_request:
    paths:
      - apps/web/**
      - apps/api/**
      - packages/shared-types/**
      - scripts/screenshots/**
      - .github/workflows/screenshots.yml

permissions:
  contents: read

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: otakuleague
          POSTGRES_PASSWORD: otakuleague_ci_password
          POSTGRES_DB: otakuleague
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U otakuleague -d otakuleague"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://otakuleague:otakuleague_ci_password@127.0.0.1:5432/otakuleague
      API_BASE_URL: http://127.0.0.1:3001
      SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm db:migrate
      # Not a dependency (ADR 0013): installed outside the repo, so no package.json or lockfile change.
      - name: Install Playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --ignore-scripts --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps --only-shell chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Start replay server, API and web
        run: |
          node scripts/screenshots/fake-sources.mjs > "$RUNNER_TEMP/replay.log" 2>&1 &
          NODE_ENV=production PORT=3001 \
            ANILIST_API_URL=http://127.0.0.1:4010 JIKAN_API_URL=http://127.0.0.1:4010/v4 \
            pnpm --filter @otakuleague/api start > "$RUNNER_TEMP/api.log" 2>&1 &
          PORT=3000 pnpm --filter @otakuleague/web start > "$RUNNER_TEMP/web.log" 2>&1 &
      - name: Health check
        run: |
          for url in http://127.0.0.1:3001/health http://127.0.0.1:3000/; do
            for _ in $(seq 30); do curl -fs -o /dev/null "$url" && continue 2; sleep 1; done
            echo "::error::$url did not answer within 30 s"
            tail -n 40 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"
            exit 1
          done
      # Always exits 0: a failed shot is recorded in manifest.json, not a failed job.
      - name: Capture
        run: node scripts/screenshots/capture.mjs
      - name: Health check after capture
        run: |
          curl -fs -o /dev/null http://127.0.0.1:3001/health || { echo "::error::API is down after the capture"; exit 1; }
          curl -fs -o /dev/null http://127.0.0.1:3000/ || { echo "::error::web is down after the capture"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pr-screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish
    needs: capture
    # Same-repo, non-Dependabot PRs only: a fork or Dependabot token cannot write.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    # No checkout, and every step is continue-on-error: a missing comment is harmless.
    steps:
      - name: Does this PR change a page?
        id: gate
        continue-on-error: true
        run: |
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          changed=$(printf '%s\n' "$files" | grep -E '^(apps/web/(app|src)/|scripts/screenshots/|\.github/workflows/screenshots\.yml$)' | grep -Ev '\.test\.tsx?$' || true)
          if [ -n "$changed" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        with:
          name: pr-screenshots
          path: shots
      # One orphan commit per PR, force-pushed: the only place a forced update is allowed (ADR 0013).
      # The Vercel config keeps Vercel from deploying a branch that has no app.
      - name: Push the images
        id: images
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          mkdir site
          cp shots/*.png site/
          mkdir site/apps site/apps/web
          echo '{"git":{"deploymentEnabled":false}}' > site/apps/web/vercel.json
          cd site
          git init -q
          git checkout -q --orphan "screenshots/pr-$PR"
          git add .
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -q -m "screenshots for PR $PR"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q --force "https://github.com/$REPO.git" "HEAD:refs/heads/screenshots/pr-$PR"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Upsert the comment
        if: steps.images.outputs.sha != ''
        continue-on-error: true
        env:
          SHA: ${{ steps.images.outputs.sha }}
        run: |
          sed "s#{{IMAGE_BASE}}#https://github.com/$REPO/raw/$SHA#g" shots/comment.md > comment.md
          if grep -q '@claude' comment.md; then echo "::warning::comment mentions @claude, not posted"; exit 0; fi
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- pr-screenshots -->"))) | .id' | head -n 1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
      - name: Delete the branches of closed PRs
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: |
          for branch in $(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name | select(startswith("screenshots/pr-"))'); do
            number=${branch#screenshots/pr-}
            state=$(gh api "repos/$REPO/pulls/$number" --jq .state || echo open)
            if [ "$state" != open ]; then gh api -X DELETE "repos/$REPO/git/refs/heads/$branch" || true; fi
          done
