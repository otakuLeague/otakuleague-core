name: Claude

# Optional helper (ADR 0010). Runs Claude Code on the Max subscription when:
# - an issue gets the `claude-ok` label (small, well-specified tasks only), or
# - someone with write access comments "@claude ..." on an issue or PR.
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (`claude setup-token` on the Mac). Without it the job fails fast.
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude-ok') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe # v1.0.269
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "${{ github.event_name == 'issues' && format('Implement GitHub issue #{0} following CLAUDE.md and the ship skill (lint, typecheck, tests, one review pass). Open a PR from a new branch; never push to main; no AI attribution. If the issue is not small and well specified, comment why and stop.', github.event.issue.number) || '' }}"
          claude_args: "--model sonnet --max-turns 40"
