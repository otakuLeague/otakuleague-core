name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token, and nothing below uses a secret, so fork and Dependabot PRs run the same way.
permissions:
  contents: read

# A new push to a PR cancels its older run. Each push to main gets its own group:
# a shared group would still cancel a pending main run when a newer one queues.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job starts from a fresh checkout. No test retries: a flaky test fails the run.
jobs:
  # OTA-183: warning only (never fails). On pull_request the checkout is the merge commit, so its
  # first parent is the base branch. Uses the runner's Node, no setup action.
  deploy-order:
    name: Deploy order
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - run: git diff --name-only --no-renames HEAD^1 HEAD | node scripts/deploy-order.mjs

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Dependency hygiene for Dependabot PRs (OTA-83): an unsupported peer range (the blocked
      # TypeScript/ESLint majors) or a second typescript-eslint copy ("Cannot redefine plugin")
      # fails here with its own name instead of as an obscure lint error.
      - run: pnpm peers check
      - run: pnpm dedupe --check
      - run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  # Two jobs on purpose: the Unit job has no Postgres, so a unit test that starts needing
  # a database fails here instead of quietly becoming an integration test. They run in parallel.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: otakuleague
          POSTGRES_PASSWORD: otakuleague_ci_password
          POSTGRES_DB: otakuleague_test
        ports:
          - 5432:5432
        # Steps start only once this passes. TCP, not the socket: during init Postgres listens on the socket only.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U otakuleague -d otakuleague_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    # The suite recreates and migrates this database itself (ADR 0005), as it does locally.
    env:
      DATABASE_URL_TEST: postgresql://otakuleague:otakuleague_ci_password@127.0.0.1:5432/otakuleague_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Prerendering "/" validates the web config; no API needs to be running. Same value as .env.example, not a secret.
    env:
      API_BASE_URL: http://127.0.0.1:3001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: pnpm build
