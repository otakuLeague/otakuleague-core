<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Error | OtakuLeague</title>
    <!-- app/global-error.tsx: the root layout failed, so this page brings its own html/body and must not depend on
         tokens.css, components.css, next/font or any image request. Everything below is inline: a copy of the few
         tokens it needs (dark default, light from the system setting; no theme cookie is readable here) and the same
         confused mascot SVG. System fonts only. -->
    <style>
      :root{--ground:#12101a;--surface:#1b1826;--ink:#ece9f3;--muted:#a29cb4;--accent:#4fd1b5;--accent-ink:#4fd1b5;--on-accent:#12101a;--border:rgba(236,233,243,.1);--neon-magenta:#ff6fae;--xp-gold:#f5c84c;--brand-a:#a78bfa;--brand-b:#22d3ee;color-scheme:dark}
      /* Screenshot variant: system set to dark. */
      *{box-sizing:border-box}
      body{margin:0;min-height:100vh;background:var(--ground);color:var(--ink);font:400 16px/1.5 ui-sans-serif,system-ui,sans-serif;display:grid;place-items:center}
      main{max-width:560px;padding:40px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
      .brand{font:700 18px/1 ui-sans-serif,system-ui,sans-serif;color:var(--ink);margin:0 0 24px}
      .eyebrow{margin:24px 0 0;font:600 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.06em;text-transform:uppercase}
      .ref{margin:24px 0 0;font-size:13px}.ref span{font-variant-numeric:tabular-nums}.ref a{color:var(--accent-ink)}.ref a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .art{width:200px;aspect-ratio:1}.art svg{display:block;width:100%;height:100%}
      h1{margin:12px 0 12px;font:700 32px/1.1 ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em;text-wrap:balance}
      p{margin:0 0 24px;color:var(--muted);max-width:44ch}
      .actions{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
      .btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--border);font:600 15px/1 ui-sans-serif,system-ui,sans-serif;text-decoration:none;cursor:pointer;background:var(--surface);color:var(--ink)}
      .btn--primary{background:var(--accent);border-color:transparent;color:var(--on-accent)}
      .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
      .m-ga{stop-color:var(--brand-a)}.m-gb{stop-color:var(--brand-b)}.m-shadow{fill:var(--ink);opacity:.1}.m-foot{fill:color-mix(in oklab,var(--brand-b) 70%,var(--ground))}.m-limb{fill:none;stroke:color-mix(in oklab,var(--brand-a) 72%,var(--ground));stroke-width:9;stroke-linecap:round}.m-limb--b{stroke:color-mix(in oklab,var(--brand-b) 72%,var(--ground))}.m-eye{fill:var(--ground)}.m-line{fill:none;stroke:var(--ground);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.m-cheek{fill:var(--neon-magenta);opacity:.8}.m-stem{fill:none;stroke:var(--brand-a);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.m-spark,.m-dot-a{fill:var(--accent-ink)}.m-dot-b{fill:var(--neon-magenta)}.m-dot-c{fill:var(--xp-gold)}.m-orbit{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:3 6;stroke-linecap:round}
      @media (prefers-reduced-motion: no-preference){.art{animation:float 3200ms cubic-bezier(.37,0,.63,1) infinite alternate}}
      @keyframes float{to{transform:translateY(-5px)}}
      @media (max-width:767px){.art{width:160px}h1{font-size:28px}.actions{flex-direction:column;align-self:stretch}}
    </style>
  </head>
  <body>
    <main>
      <p class="brand">OtakuLeague</p>
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 200 200" aria-hidden="true" focusable="false" data-pose="confused"><defs><linearGradient id="mg-ge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="m-ga"/><stop offset="1" class="m-gb"/></linearGradient></defs>
  <ellipse class="m-shadow" cx="100" cy="181" rx="48" ry="5"/>
  <ellipse class="m-orbit" cx="100" cy="42" rx="44" ry="10"/>
  <g transform="rotate(-3 100 176)">
    <rect class="m-foot" x="70" y="164" width="22" height="18" rx="9"/>
    <rect class="m-foot" x="108" y="164" width="22" height="18" rx="9"/>
    <rect x="50" y="62" width="100" height="110" rx="36" fill="url(#mg-ge)"/>
    <path class="m-stem" d="M100 62l-5-9 9-6-4-10"/>
    <path class="m-spark" transform="translate(101 33) rotate(20) scale(.85)" d="M0-11C1.6-3 3-1.6 11 0 3 1.6 1.6 3 0 11-1.6 3-3 1.6-11 0-3-1.6-1.6-3 0-11Z"/>
    <path class="m-line" d="M84 106m-1.5 0a1.5 1.5 0 1 1 3 0a3.5 3.5 0 1 1-7 0a5.5 5.5 0 1 1 11 0a7.5 7.5 0 1 1-15 0"/>
    <path class="m-line" d="M116 106m-1.5 0a1.5 1.5 0 1 1 3 0a3.5 3.5 0 1 1-7 0a5.5 5.5 0 1 1 11 0a7.5 7.5 0 1 1-15 0"/>
    <ellipse class="m-cheek" cx="68" cy="126" rx="7" ry="4"/>
    <ellipse class="m-cheek" cx="132" cy="126" rx="7" ry="4"/>
    <path class="m-line" d="M86 132q3.5-4 7 0t7 0 7 0 7 0"/>
    <path class="m-limb" d="M53 126q-8 12-2 22"/>
    <path class="m-limb m-limb--b" d="M147 110q16-6 12-28"/>
  </g>
  <circle class="m-dot-a" cx="58" cy="45" r="4"/>
  <circle class="m-dot-b" cx="140" cy="37" r="3.5"/>
  <path class="m-dot-c" transform="translate(124 50) scale(.5)" d="M0-11C1.6-3 3-1.6 11 0 3 1.6 1.6 3 0 11-1.6 3-3 1.6-11 0-3-1.6-1.6-3 0-11Z"/>
</svg>
      </div>
      <p class="eyebrow">Error</p>
      <h1>Something tripped us up</h1>
      <p>OtakuLeague couldn’t load because of an error on our side. Trying again usually fixes it.</p>
      <div class="actions"><button class="btn btn--primary" type="button">Try again</button><a class="btn" href="/">Go home</a></div>
      <p class="ref">Reference <span>3871204556</span> · include it if you <a href="/contact">contact us</a></p>
    </main>
  </body>
</html>
